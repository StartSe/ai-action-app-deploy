# Blueprint de publicação de Call Guiada (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/call-guiada:latest.
# Este app exige o plano starter (pago) e cria um disco de 1 GB em /app/data, onde ficam os repertórios, as chaves conectadas, as sessões e a senha de acesso.
# Abra o app, cole o código de instalação (está em Environment, na variável CODIGO_INSTALACAO) e crie a senha de acesso. Depois conecte a OpenRouter, mande os documentos da empresa e conecte o Zoom enquanto o guia se prepara.
services:
  - type: web
    name: call-guiada
    runtime: image
    image:
      url: ghcr.io/startse/call-guiada:latest
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: CODIGO_INSTALACAO
        generateValue: true
    # Os repertórios, as chaves conectadas, as sessões e a senha de acesso ficam em /app/data e sobrevivem a deploys.
    disk:
      name: call-guiada-dados
      mountPath: /app/data
      sizeGB: 1
