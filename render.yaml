# Blueprint de publicação de Entrelinhas (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/entrelinhas:latest.
# Este app exige o plano 0.5c-512mb (pago) e cria um disco de 1 GB em /app/data, onde ficam a conta, as configurações, os documentos guardados e o registro de calibração.
# Crie sua conta e, em Configurações, conecte o OpenRouter com um clique. Depois abra um PDF, faça uma pergunta e veja a resposta acesa na página. O disco mantém a conta e os documentos que você guardar depois de cada publicação.
services:
  - type: web
    name: entrelinhas
    runtime: image
    image:
      url: ghcr.io/startse/entrelinhas:latest
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # A conta, as configurações, os documentos guardados e o registro de calibração ficam em /app/data e sobrevivem a deploys.
    disk:
      name: entrelinhas-dados
      mountPath: /app/data
      sizeGB: 1
