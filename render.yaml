# Blueprint de publicação de Planilha Preditiva (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/planilha-preditiva:latest.
# Este app exige o plano starter (pago) e cria um disco de 1 GB em /app/data, onde ficam a conta, a chave do OpenRouter, a chave da ElevenLabs e os contadores do Jev.
# Crie sua conta e, em Configurações, conecte o OpenRouter em um clique. Abra Leads do Instagram, escreva «Quer comprar?» no campo da nova coluna e aperte Enter: a coluna se preenche em onda, com a probabilidade em cada célula. Importe qualquer CSV de até 300 linhas.
services:
  - type: web
    name: planilha-preditiva
    runtime: image
    image:
      url: ghcr.io/startse/planilha-preditiva:latest
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
    # A conta, a chave do OpenRouter, a chave da ElevenLabs e os contadores do Jev ficam em /app/data e sobrevivem a deploys.
    disk:
      name: planilha-preditiva-dados
      mountPath: /app/data
      sizeGB: 1
