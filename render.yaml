# Blueprint de publicação de Estúdio por Voz (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/estudio-por-voz:latest.
# Instalação gratuita de teste, sem volume: contas, configurações e respostas podem se perder em reinícios e atualizações.
# Para manter os dados, use a opção com volume (pago): https://render.com/deploy?repo=https://github.com/StartSe/ai-action-app-deploy/tree/deploy-estudio-por-voz-persistente.
# O formulário do Render pede ADMIN_EMAIL e ADMIN_SENHA: são o e-mail e a senha do dono, recriados a cada reinício.
# Após publicar, entre com eles e conecte a IA em /setup.
services:
  - type: web
    name: estudio-por-voz
    runtime: image
    image:
      url: ghcr.io/startse/estudio-por-voz:latest
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
    # Para manter a configuração feita em /setup entre deploys (exige plano pago):
    # disk:
    #   name: estudio-por-voz-dados
    #   mountPath: /app/data
    #   sizeGB: 1
