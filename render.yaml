# Blueprint de publicação de Estúdio Inteligente · AI Journey (especificação: https://render.com/docs/blueprint-spec)
# Imagem pública publicada pelo GitHub Actions em ghcr.io/startse/estudio-inteligente-ai-journey:latest.
# Nenhuma chave é necessária aqui: após publicar, abra o app e conecte a IA nas Configurações.
# No plano free o disco é efêmero: conta, chave e dados se perdem a cada deploy.
# Gerado por scripts/gerar-deploy.mjs a partir de StartSe/ai-action-journey-demo/catalogo.json. Não edite à mão.
services:
  - type: web
    name: estudio-inteligente-ai-journey
    runtime: image
    image:
      url: ghcr.io/startse/estudio-inteligente-ai-journey:latest
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: CHAVE_MESTRA
        generateValue: true
    # Para manter a conta, a chave e os dados entre deploys (exige plano pago):
    # disk:
    #   name: estudio-inteligente-ai-journey-dados
    #   mountPath: /app/data
    #   sizeGB: 1
